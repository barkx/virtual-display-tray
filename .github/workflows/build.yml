name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build VirtualDisplayTray.exe
        shell: cmd
        run: Build.cmd

      - uses: actions/upload-artifact@v4
        with:
          name: VirtualDisplayTray
          path: bin/VirtualDisplayTray.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" bin/VirtualDisplayTray.exe \
            --title "Virtual Display Tray $GITHUB_REF_NAME" \
            --generate-notes
